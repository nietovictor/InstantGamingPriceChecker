<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Panel público de precios actuales">
    <title>Price Dashboard</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0a1020;
            --card: #111a2e;
            --border: #263657;
            --muted: #d7e1f2;
            --subtle: #9fb0cc;
            --accent: #818cf8;
            --accent-hover: #6366f1;
            --green: #34d399;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: #f8fafc;
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        header {
            border-bottom: 1px solid var(--border);
            background: var(--card);
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .header-inner, main, footer {
            width: min(1180px, calc(100% - 32px));
            margin: auto;
        }
        .header-inner {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        h1, h2, p { margin: 0; }
        h1 { font-size: 1.35rem; }
        h1 span { color: var(--accent); }
        .subtitle, .meta, label { color: var(--muted); }
        .subtitle { font-size: .85rem; margin-top: 2px; }
        button, input, select {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #10151f;
            color: #f8fafc;
            font: inherit;
        }
        button { cursor: pointer; padding: 9px 13px; }
        button:hover { border-color: var(--accent); color: white; }
        main { padding: 30px 0 42px; }
        .intro, .toolbar, .stat, .game {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
        }
        .intro {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            padding: 22px;
            margin-bottom: 18px;
        }
        .intro h2 { font-size: 1.6rem; }
        .status { color: var(--green); font-size: .85rem; text-align: right; }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 18px;
        }
        .stat { padding: 17px; }
        .stat label {
            display: block;
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .08em;
        }
        .stat strong { display: block; font-size: 1.8rem; margin-top: 4px; }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            margin-bottom: 18px;
        }
        input { flex: 1; min-width: 180px; padding: 10px 12px; }
        select { padding: 10px 12px; }
        .filters { display: flex; gap: 7px; }
        .filters button.active { background: var(--accent); border-color: var(--accent); color: #0a1020; }
        #games { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
        .game { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
        .game-header { display: flex; justify-content: space-between; gap: 12px; }
        .game h3 { font-size: 1.05rem; line-height: 1.3; }
        .badge {
            flex: 0 0 auto;
            color: var(--green);
            font-size: .72rem;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .badge.above { color: #fbbf24; }
        .price-box {
            background: #0f141d;
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 14px;
        }
        .price-label { color: var(--muted); font-size: .75rem; text-transform: uppercase; }
        .price { color: var(--green); display: block; font-size: 2.45rem; font-weight: 800; line-height: 1.1; }
        .price.above { color: white; }
        .target { color: var(--muted); font-size: .83rem; }
        .game a {
            color: white;
            background: #253044;
            border-radius: 9px;
            padding: 9px;
            text-align: center;
            text-decoration: none;
            font-size: .85rem;
        }
        .game a:hover { background: var(--accent-hover); }
        .empty, .error { color: var(--muted); grid-column: 1 / -1; padding: 34px; text-align: center; }
        footer { border-top: 1px solid var(--border); color: var(--subtle); font-size: .8rem; padding: 18px 0 28px; text-align: center; }
        @media (max-width: 760px) {
            .header-inner, .intro, .toolbar { align-items: stretch; flex-direction: column; }
            .header-inner { justify-content: center; padding: 14px 0; }
            .status { text-align: left; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .filters { overflow-x: auto; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div>
                <h1>Price <span>Dashboard</span></h1>
                <p class="subtitle">Precios actuales de tus juegos</p>
            </div>
            <button type="button" id="refresh">Actualizar datos</button>
        </div>
    </header>

    <main>
        <section class="intro">
            <div>
                <h2>Resumen de precios</h2>
                <p class="meta">Información publicada automáticamente desde <code>prices.csv</code>.</p>
            </div>
            <p class="status"><span id="status">Cargando datos...</span><br><span class="updated-label">Última actualización publicada: <strong id="last-updated">--</strong></span></p>
        </section>

        <section class="stats" aria-label="Resumen">
            <div class="stat"><label>Juegos</label><strong id="total">0</strong></div>
            <div class="stat"><label>En oferta</label><strong id="deals">0</strong></div>
            <div class="stat"><label>Por encima</label><strong id="above">0</strong></div>
            <div class="stat"><label>Ahorro frente al objetivo</label><strong id="savings">0,00 €</strong></div>
        </section>

        <section class="toolbar" aria-label="Filtros">
            <input id="search" type="search" placeholder="Buscar juego..." aria-label="Buscar juego">
            <div class="filters">
                <button type="button" class="active" data-filter="all">Todos</button>
                <button type="button" data-filter="deals">En oferta</button>
                <button type="button" data-filter="above">Por encima</button>
            </div>
            <select id="sort" aria-label="Ordenar">
                <option value="name">Nombre</option>
                <option value="price">Precio menor</option>
                <option value="saving">Mayor ahorro</option>
            </select>
        </section>

        <section id="games" aria-live="polite"></section>
    </main>

    <footer>Datos actualizados desde el comprobador local · Solo lectura</footer>

    <script>
        const state = { games: [], filter: "all" };
        const $ = id => document.getElementById(id);

        function parseCsv(text) {
            const rows = [];
            let row = [], value = "", quoted = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i], next = text[i + 1];
                if (char === '"' && quoted && next === '"') { value += '"'; i++; }
                else if (char === '"') quoted = !quoted;
                else if (char === ',' && !quoted) { row.push(value); value = ""; }
                else if ((char === '\n' || char === '\r') && !quoted) {
                    if (char === '\r' && next === '\n') i++;
                    row.push(value); if (row.some(Boolean)) rows.push(row);
                    row = []; value = "";
                } else value += char;
            }
            row.push(value); if (row.some(Boolean)) rows.push(row);
            const headers = rows.shift() || [];
            return rows.map(values => headers.reduce((record, key, i) => {
                record[key] = values[i] || ""; return record;
            }, {}));
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
            }[char]));
        }

        async function loadPrices() {
            $("status").textContent = "Cargando datos...";
            try {
                const response = await fetch(`prices.csv?t=${Date.now()}`, { cache: "no-store" });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                state.games = parseCsv(await response.text()).map((game, index) => ({
                    id: index,
                    name: game.name || "Juego sin nombre",
                    url: game.url,
                    threshold: Number(game.threshold),
                    price: game.price === "" ? null : Number(game.price),
                    checkedAt: game.checked_at
                })).filter(game => game.url && Number.isFinite(game.threshold));
                const updated = state.games[0]?.checkedAt;
                $("status").textContent = "Datos disponibles";
                $("last-updated").textContent = updated
                    ? new Date(updated).toLocaleString("es-ES")
                    : "No disponible";
                render();
            } catch (error) {
                $("status").textContent = "No se pudieron cargar los datos";
                $("games").innerHTML = '<p class="error">Comprueba que GitHub Pages esté publicado y que prices.csv exista en el repositorio.</p>';
            }
        }

        function render() {
            const search = $("search").value.toLowerCase();
            const sort = $("sort").value;
            const filtered = state.games.filter(game => {
                const matches = game.name.toLowerCase().includes(search);
                const deal = game.price !== null && game.price <= game.threshold;
                return matches && (state.filter === "all" || (state.filter === "deals" && deal) || (state.filter === "above" && game.price !== null && !deal));
            }).sort((a, b) => sort === "name" ? a.name.localeCompare(b.name) : sort === "price" ? (a.price ?? Infinity) - (b.price ?? Infinity) : (b.threshold - (b.price ?? b.threshold)) - (a.threshold - (a.price ?? a.threshold)));

            const deals = state.games.filter(game => game.price !== null && game.price <= game.threshold);
            const savings = deals.reduce((sum, game) => sum + game.threshold - game.price, 0);
            $("total").textContent = state.games.length;
            $("deals").textContent = deals.length;
            $("above").textContent = state.games.filter(game => game.price !== null && game.price > game.threshold).length;
            $("savings").textContent = `${savings.toFixed(2).replace(".", ",")} €`;
            $("games").innerHTML = filtered.length ? filtered.map(game => {
                const deal = game.price !== null && game.price <= game.threshold;
                return `<article class="game">
                    <div class="game-header"><h3>${escapeHtml(game.name)}</h3><span class="badge ${deal ? "" : "above"}">${deal ? "En oferta" : "Por encima"}</span></div>
                    <div class="price-box"><span class="price-label">Precio actual</span><strong class="price ${deal ? "" : "above"}">${game.price === null ? "Sin precio" : `${game.price.toFixed(2)} €`}</strong><span class="target">Objetivo: ${game.threshold.toFixed(2)} €</span></div>
                    <a href="${escapeHtml(game.url)}" target="_blank" rel="noopener noreferrer">Ver producto</a>
                </article>`;
            }).join("") : '<p class="empty">No hay juegos que coincidan con los filtros.</p>';
        }

        $("refresh").addEventListener("click", loadPrices);
        $("search").addEventListener("input", render);
        $("sort").addEventListener("change", render);
        document.querySelectorAll("[data-filter]").forEach(button => button.addEventListener("click", () => {
            state.filter = button.dataset.filter;
            document.querySelectorAll("[data-filter]").forEach(item => item.classList.toggle("active", item === button));
            render();
        }));
        loadPrices();
    </script>
</body>
</html>
